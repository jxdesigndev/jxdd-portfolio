<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JX COMMAND CENTER // ROOT_ACCESS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body class="admin-body">
  <a href="#page" class="skip-to-content">Skip to content</a>

  <div id="page">
    <!-- LOGIN LAYER -->
    <div id="admin-login" class="admin-login-overlay">
    <div class="admin-login-box">
      <div class="admin-login-header">
        <span class="logo">JX // CC</span>
        <span style="color:var(--gray-3); font-size:var(--text-xs); font-family:var(--font-mono);">AUTH_REQUIRED</span>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Root Identity (Email)</label>
          <input type="email" id="login-email" class="form-input" required autocomplete="username">
        </div>
        <div class="form-group" style="margin-top:var(--s-4);">
          <label class="form-label" for="login-password">Passphrase</label>
          <input type="password" id="login-password" class="form-input" required autocomplete="current-password">
        </div>
        <div id="login-error" class="form-status error" style="display:none; margin-top:var(--s-2);"></div>
        <button type="submit" class="btn btn-primary" style="margin-top:var(--s-6); width:100%; justify-content:center;">INITIATE_HANDSHAKE ↗</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD LAYER -->
  <div id="admin-dashboard" class="admin-layout" style="display:none;">
    
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar-top">
        <div class="logo">JX_CC</div>
        <p style="font-family:var(--font-mono); font-size:10px; color:var(--gray-3); letter-spacing:1px; margin-top:var(--s-1);">COMMAND_CENTER v2.0</p>
      </div>
      
      <nav class="admin-nav">
        <button class="admin-nav-btn active" data-tab="projects">01 // THE_VAULT (Projects)</button>
        <button class="admin-nav-btn" data-tab="messages">02 // SIGNALS (Messages)</button>
        <button class="admin-nav-btn" data-tab="settings">03 // CORE (Settings)</button>
      </nav>
      
      <div class="admin-sidebar-bottom">
        <button id="btn-logout" class="btn btn-ghost btn-sm" style="width:100%; justify-content:flex-start;">Term_Session()</button>
      </div>
    </aside>

    <!-- Main Area -->
    <main class="admin-main">
      
      <!-- PROJECTS TAB -->
      <section id="tab-projects" class="admin-tab-content active">
        <header class="admin-header">
          <h1 class="headline-md">The Vault</h1>
          <button id="btn-new-project" class="btn btn-primary btn-sm">+ Deploy New Project</button>
        </header>

        <div class="admin-table-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Priority</th>
                <th>Title</th>
                <th>Category</th>
                <th>Year</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="projects-tbody">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- MESSAGES TAB -->
      <section id="tab-messages" class="admin-tab-content">
        <header class="admin-header">
          <h1 class="headline-md">Intercepted Signals</h1>
        </header>
        <div class="admin-table-container">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Sender</th>
                <th>Project Type</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="messages-tbody">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- SETTINGS TAB -->
      <section id="tab-settings" class="admin-tab-content">
        <header class="admin-header">
          <h1 class="headline-md">Core Directives</h1>
        </header>
        
        <div class="admin-card" style="max-width:600px;">
          <h3 style="font-family:var(--font-display); font-size:var(--text-lg); margin-bottom:var(--s-4);">Availability Status</h3>
          <form id="settings-form">
            <div class="form-group">
              <select id="setting-availability" class="form-select">
                <option value="available">Available for Work</option>
                <option value="limited">Limited Availability</option>
                <option value="unavailable">Currently Unavailable</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary btn-sm" style="margin-top:var(--s-4);">Update Status</button>
          </form>
        </div>

        <div class="admin-card" style="max-width:600px; margin-top:var(--s-6);">
          <h3 style="font-family:var(--font-display); font-size:var(--text-lg); margin-bottom:var(--s-4);">Social Links</h3>
          <form id="socials-form">
            <div class="form-group">
              <label class="form-label">Twitter</label>
              <input type="url" id="setting-social-twitter" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">LinkedIn</label>
              <input type="url" id="setting-social-linkedin" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">GitHub</label>
              <input type="url" id="setting-social-github" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">Dribbble</label>
              <input type="url" id="setting-social-dribbble" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">Instagram</label>
              <input type="url" id="setting-social-instagram" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">Contra</label>
              <input type="url" id="setting-social-contra" class="form-input">
            </div>
            <div class="form-group">
              <label class="form-label">Upwork</label>
              <input type="url" id="setting-social-upwork" class="form-input">
            </div>
            <button type="submit" class="btn btn-primary btn-sm" style="margin-top:var(--s-4);">Save Social Links</button>
          </form>
        </div>
      </section>

    </main>
  </div>

  <!-- PROJECT EDIT MODAL -->
  <div id="project-modal" class="admin-modal-overlay">
    <div class="admin-modal">
      <div class="admin-modal-header">
        <h2 id="project-modal-title" class="headline-sm">Deploy Project</h2>
        <button id="project-modal-close" class="btn btn-ghost btn-sm">✕</button>
      </div>
      <form id="project-form" class="admin-modal-body">
        <input type="hidden" id="pf-id">
        
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="pf-title">Title *</label>
            <input type="text" id="pf-title" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="pf-category">Category *</label>
            <input type="text" id="pf-category" class="form-input" placeholder="e.g. Web Design" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="pf-year">Year</label>
            <input type="text" id="pf-year" class="form-input" placeholder="2026">
          </div>
          <div class="form-group">
            <label class="form-label" for="pf-priority">Sort Priority</label>
            <input type="number" id="pf-priority" class="form-input" value="0">
          </div>
        </div>

        <div class="form-group" style="flex-direction:row; align-items:center; gap:var(--s-3);">
          <input type="checkbox" id="pf-featured" style="width:18px; height:18px; accent-color:var(--green); cursor:pointer;">
          <label class="form-label" for="pf-featured" style="margin:0; cursor:pointer;">Feature on homepage (max 3 shown)</label>
        </div>

        <div class="form-group">
          <label class="form-label" for="pf-image">Cover Image URL</label>
          <input type="text" id="pf-image" class="form-input" placeholder="https://...">
        </div>

        <div class="form-group">
          <label class="form-label" for="pf-tools">Tools (comma separated)</label>
          <input type="text" id="pf-tools" class="form-input" placeholder="React, Figma, GSAP">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="pf-url">Live Link</label>
            <input type="text" id="pf-url" class="form-input" placeholder="https://...">
          </div>
          <div class="form-group">
            <label class="form-label" for="pf-github">GitHub Link</label>
            <input type="text" id="pf-github" class="form-input" placeholder="https://...">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="pf-desc">Short Description (for card)</label>
          <textarea id="pf-desc" class="form-textarea" rows="2"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="pf-content">Full Content / Story</label>
          <textarea id="pf-content" class="form-textarea" rows="6"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="pf-casestudy">Case Study Link (optional)</label>
          <input type="text" id="pf-casestudy" class="form-input" placeholder="https://...">
        </div>

        <div class="admin-modal-actions">
          <button type="button" id="btn-delete-project" class="btn btn-ghost btn-sm" style="color:var(--red); display:none;">Delete_Project</button>
          <div style="flex:1;"></div>
          <button type="submit" class="btn btn-primary btn-sm">Save_To_Vault ↗</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MESSAGE VIEW MODAL -->
  <div id="message-modal" class="admin-modal-overlay">
    <div class="admin-modal" style="max-width: 600px;">
      <div class="admin-modal-header">
        <h2 class="headline-sm">Intercepted Signal</h2>
        <button id="message-modal-close" class="btn btn-ghost btn-sm">✕</button>
      </div>
      <div class="admin-modal-body">
        <p style="font-family:var(--font-mono); font-size:var(--text-xs); color:var(--gray-3); margin-bottom:var(--s-4);">
          FROM: <span id="mf-name" style="color:var(--green);"></span> &lt;<span id="mf-email" style="color:white;"></span>&gt;<br>
          TYPE: <span id="mf-type" style="color:var(--white);"></span><br>
          BUDGET: <span id="mf-budget" style="color:var(--white);"></span><br>
          DATE: <span id="mf-date" style="color:var(--white);"></span>
        </p>
        <div style="background:var(--surface-2); padding:var(--s-4); border-radius:var(--radius-md); border:1px solid var(--border);">
          <p id="mf-message" style="font-family:var(--font-body); font-size:var(--text-sm); line-height:1.6; color:var(--gray-1); white-space:pre-wrap;"></p>
        </div>
      </div>
    </div>
  </div>

  </div>
  <script src="admin.js"></script>
</body>
</html>
