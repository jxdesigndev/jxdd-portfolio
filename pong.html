<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pong - JX</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #010204; font-family: monospace; }
    #pong-canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    #pong-hud {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      pointer-events: none; padding-top: 32px; z-index: 10;
    }
    .pong-score {
      font-size: clamp(36px, 6vw, 72px); font-weight: 700; color: #00ff41;
      text-shadow: 0 0 20px rgba(0,255,65,0.8), 0 0 50px rgba(0,255,65,0.4);
      letter-spacing: 0.2em; line-height: 1;
    }
    .pong-sep { color: rgba(0,255,65,0.3); margin: 0 0.3em; }
    .pong-title { font-size: 11px; letter-spacing: 0.3em; color: rgba(0,255,65,0.4); margin-top: 8px; text-transform: uppercase; }
    .pong-hint { font-size: 11px; letter-spacing: 0.2em; color: rgba(255,255,255,0.25); margin-top: 4px; }
    .pong-close {
      position: absolute; top: 32px; right: 32px;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5); font-size: 24px; font-weight: 300;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; text-decoration: none; pointer-events: auto;
      transition: all 0.3s ease; line-height: 1;
    }
    .pong-close:hover {
      background: #00ff41; color: #010204; border-color: #00ff41;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
  <script src="pong.js" defer></script>
</head>
<body>
  <canvas id="pong-canvas"></canvas>
  <div id="pong-hud">
    <a href="/" class="pong-close" aria-label="Exit Game">×</a>
    <div class="pong-score" aria-live="polite" aria-atomic="true">
      <span id="pong-score-l">00</span><span class="pong-sep">·</span><span id="pong-score-r">00</span>
    </div>
    <div class="pong-title">PARTICLE PONG</div>
    <div class="pong-hint">Move mouse · Esc to exit</div>
  </div>
</body>
</html>
