<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="canonical" href="https://www.jxdesign.dev/project.html">
  <meta name="description" content="Case study by Okezie Ferdinand (JX) — Product Designer & Full-Stack Developer.">
  <title>Case Study | JX Design & Dev</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">

  <!-- GSAP -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js" defer></script>
  <!-- Lenis -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js" defer></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="supabase.js" defer></script>

  <link rel="stylesheet" href="style.css">

  <style>

    /* ── Page wrapper ── */
    #page { opacity: 0; }

    /* Custom styles for case study */
    .case-study-hero {
      padding: 160px var(--s-8) var(--s-16);
      max-width: var(--container-md);
      margin: 0 auto;
    }
    
    .case-study-meta {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--green);
      letter-spacing: 0.1em;
      margin-bottom: var(--s-12);
      display: flex;
      flex-wrap: wrap;
      gap: var(--s-6);
    }
    .case-study-meta div {
      display: flex;
      flex-direction: column;
      gap: var(--s-2);
    }
    .case-study-meta span {
      color: var(--white);
    }

    .case-study-title {
      font-family: var(--font-display);
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 800;
      line-height: 1;
      color: var(--white);
      margin: 0 0 var(--s-8);
    }

    .case-study-content {
      max-width: var(--container-md);
      margin: 0 auto;
      padding: 0 var(--s-8) var(--s-24);
      font-family: var(--font-body);
      font-size: var(--text-lg);
      color: var(--gray-2);
      line-height: var(--lead-relaxed);
    }

    .case-study-content h2 {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 700;
      color: var(--white);
      margin: var(--s-16) 0 var(--s-6);
    }

    .case-study-content p {
      margin-bottom: var(--s-6);
      font-family: var(--font-body);
    }
    
    .case-study-content ul {
      margin-bottom: var(--s-6);
      padding-left: var(--s-6);
    }
    
    .case-study-content li {
      margin-bottom: var(--s-2);
    }
    
    .case-study-image-full {
      width: 100%;
      height: auto;
      border-radius: 8px;
      margin: var(--s-12) 0;
    }

    .pull-quote {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 3vw, 2.5rem);
      font-weight: 700;
      color: var(--white);
      line-height: var(--lead-tight);
      margin: var(--s-12) 0;
      padding-left: var(--s-8);
      border-left: 2px solid var(--gold);
    }
    
    .image-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--s-8);
      margin: var(--s-12) 0;
    }
    
    @media (min-width: 768px) {
      .image-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    
    .image-caption {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--gray-1);
      font-weight: 500;
      letter-spacing: var(--track-wider);
      text-transform: uppercase;
      margin-top: var(--s-2);
      text-align: center;
    }

    .screenshot-gallery {
      display: grid;
      /* Auto-fill columns: portrait images (~280px min) flow 2-3 per row;
         landscape images break out to full width via grid-column span below. */
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--s-8);
      align-items: start;
      margin: var(--s-16) 0;
    }

    .screenshot-frame {
      background: linear-gradient(145deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: var(--s-8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.2), 0 10px 30px rgba(0, 0, 0, 0.3);
      width: 100%;
    }

    /* Portrait frames: sit in auto-filled grid columns (2-3 per row on desktop) */
    .screenshot-frame.frame-portrait {
      /* No override needed — grid auto-fill handles column width */
    }

    /* Landscape frames: always span the full grid row */
    .screenshot-frame.frame-landscape {
      grid-column: 1 / -1;
    }

    .screenshot-frame picture {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .screenshot-frame img {
      width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      margin: 0;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    
    .parallax-img {
      width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .split-section {
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--s-12);
      align-items: center;
      margin: var(--s-12) 0;
    }
    @media (min-width: 768px) {
      .split-section {
        grid-template-columns: 1fr 1fr;
      }
    }
    
    .placeholder-card {
      background: linear-gradient(145deg, var(--surface-1), var(--surface-2));
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      aspect-ratio: 9/16;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--s-4);
      padding: var(--s-8);
      text-align: center;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .placeholder-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.06), transparent 60%);
      pointer-events: none;
    }
    .placeholder-card:hover {
      transform: translateY(-8px);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.4), 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .placeholder-icon {
      font-size: 3rem;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
      opacity: 0.9;
    }
    .placeholder-text {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--gray-3);
      letter-spacing: var(--track-widest);
      text-transform: uppercase;
      line-height: 1.5;
    }

    /* ── Rich Text (TipTap) output styles ── */
    .tiptap-content p {
      margin-bottom: var(--s-6);
      line-height: var(--lead-relaxed);
    }
    .tiptap-content p:last-child {
      margin-bottom: 0;
    }
    .tiptap-content strong, .tiptap-content b {
      color: var(--white);
      font-weight: 600;
    }
    .tiptap-content em, .tiptap-content i {
      font-style: italic;
    }
    .tiptap-content blockquote {
      border-left: 2px solid var(--green);
      padding-left: var(--s-6);
      margin: var(--s-8) 0;
      color: var(--gray-3);
      font-style: italic;
    }
    .tiptap-content ul, .tiptap-content ol {
      margin: var(--s-4) 0 var(--s-6);
      padding-left: var(--s-6);
    }
    .tiptap-content li {
      margin-bottom: var(--s-2);
      line-height: var(--lead-relaxed);
    }
    .tiptap-content h2, .tiptap-content h3, .tiptap-content h4 {
      color: var(--white);
      font-family: var(--font-display);
      font-weight: 700;
      margin: var(--s-10) 0 var(--s-4);
    }
    .tiptap-content h2 { font-size: clamp(1.5rem, 3vw, 2rem); }
    .tiptap-content h3 { font-size: clamp(1.2rem, 2.5vw, 1.6rem); }
    .tiptap-content h4 { font-size: var(--text-lg); }
  
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
</head>
<body>
  <a href="#page" class="skip-to-content">Skip to content</a>
  <div id="page">
    <main id="main-content">
      <div id="loading-state" style="padding: 160px var(--s-8); text-align: center; color: var(--gray-2); font-family: var(--font-mono); font-size: var(--text-sm); letter-spacing: var(--track-widest);">
        INITIATING...
      </div>
    </main>

    <!-- ── FOOTER ── -->
    <footer style="border-top: 1px solid var(--border); padding: var(--s-8) var(--s-8); display:flex; justify-content:space-between; align-items:center; flex-wrap: wrap; gap: var(--s-4);">
      <span style="font-family: var(--font-mono); font-size: var(--text-xs); color: var(--gray-2);">
        © 2026 JX. Nigeria.
      </span>
      <span id="footer-project-title" style="font-family: var(--font-mono); font-size: var(--text-xs); color: var(--green);">
        CASE STUDY
      </span>
    </footer>
  </div>

  <script src="nav.js" defer></script>
  <script src="project.js" defer></script>
</body>
</html>
