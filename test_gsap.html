<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <!-- NOTE: ScrollTrigger NOT loaded, or loaded but NOT registered -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
</head>
<body>
  <div id="box">Box</div>
  <script>
    try {
      gsap.to('#box', {
        x: 100,
        scrollTrigger: {
          trigger: '#box',
          start: 'top center'
        }
      });
      console.log("Success without registerPlugin");
    } catch(e) {
      console.log("Failed:", e);
    }
  </script>
</body>
</html>
